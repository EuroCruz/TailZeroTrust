name: Track Tailscale and WARP releases

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.check.outputs.ref }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compare with the latest releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ts_current="$(sed -n 's/^ARG TS_VERSION="\(.*\)"$/\1/p' Dockerfile)"
          warp_current="$(sed -n 's/^ARG WARP_VERSION="\(.*\)"$/\1/p' Dockerfile)"

          ts_latest="$(gh api repos/tailscale/tailscale/releases/latest --jq .tag_name)"
          warp_latest="$(curl -fsSL "https://pkg.cloudflareclient.com/dists/bookworm/main/binary-amd64/Packages" \
            | sed -n 's/^Version: //p' | sort -V | tail -n 1)"
          echo "Tailscale: $ts_current -> $ts_latest"
          echo "WARP: $warp_current -> $warp_latest"

          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$2" ]; }
          changes=""

          # Go builder image, a new version alone only refreshes :latest
          go_current="$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)"
          go_alpine="$(sed -n 's/^FROM golang:[0-9.]*-alpine\([0-9.]*\).*/\1/p' Dockerfile)"
          go_latest="$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -n 1 | sed 's/^go//')"
          echo "Go: $go_current -> $go_latest"
          go_changed=""
          if newer "$go_current" "$go_latest" && \
              curl -fs -o /dev/null "https://hub.docker.com/v2/repositories/library/golang/tags/$go_latest-alpine$go_alpine"; then
            sed -i "s/^FROM golang:$go_current-alpine/FROM golang:$go_latest-alpine/" Dockerfile
            go_changed="golang to $go_latest"
          fi
          if newer "$ts_current" "$ts_latest"; then
            sed -i "s/^ARG TS_VERSION=\".*\"$/ARG TS_VERSION=\"$ts_latest\"/" Dockerfile
            changes="Tailscale to $ts_latest"
          else
            ts_latest="$ts_current"
          fi
          if newer "$warp_current" "$warp_latest"; then
            sed -i "s/^ARG WARP_VERSION=\".*\"$/ARG WARP_VERSION=\"$warp_latest\"/" Dockerfile
            changes="${changes:+$changes and }Cloudflare WARP to $warp_latest"
          else
            warp_latest="$warp_current"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$changes" ]; then
            if [ -n "$go_changed" ]; then
              git commit -am "Upgrade $go_changed"
              git push origin HEAD:main
              echo "ref=main" >> "$GITHUB_OUTPUT"
            else
              echo "Everything is up to date"
            fi
            exit 0
          fi
          [ -n "$go_changed" ] && changes="$go_changed, $changes"

          tag="${ts_latest}-warp${warp_latest}"
          git commit -am "Upgrade $changes"
          git tag "$tag"
          git push origin HEAD:main "$tag"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.ref != ''
    uses: ./.github/workflows/ghcr-publish.yml
    with:
      ref: ${{ needs.check.outputs.ref }}
      version: ${{ needs.check.outputs.tag }}
    secrets: inherit
