name: Track Tailscale and WARP releases

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compare with the latest releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ts_current="$(sed -n 's/^ARG TS_VERSION="\(.*\)"$/\1/p' Dockerfile)"
          warp_current="$(sed -n 's/^ARG WARP_VERSION="\(.*\)"$/\1/p' Dockerfile)"

          ts_latest="$(gh api repos/tailscale/tailscale/releases/latest --jq .tag_name)"
          warp_latest="$(curl -fsSL "https://pkg.cloudflareclient.com/dists/bookworm/main/binary-amd64/Packages" \
            | sed -n 's/^Version: //p' | sort -V | tail -n 1)"
          echo "Tailscale: $ts_current -> $ts_latest"
          echo "WARP: $warp_current -> $warp_latest"

          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$2" ]; }
          changes=""
          if newer "$ts_current" "$ts_latest"; then
            sed -i "s/^ARG TS_VERSION=\".*\"$/ARG TS_VERSION=\"$ts_latest\"/" Dockerfile
            changes="Tailscale to $ts_latest"
          else
            ts_latest="$ts_current"
          fi
          if newer "$warp_current" "$warp_latest"; then
            sed -i "s/^ARG WARP_VERSION=\".*\"$/ARG WARP_VERSION=\"$warp_latest\"/" Dockerfile
            changes="${changes:+$changes and }Cloudflare WARP to $warp_latest"
          else
            warp_latest="$warp_current"
          fi

          if [ -z "$changes" ]; then
            echo "Everything is up to date"
            exit 0
          fi

          tag="${ts_latest}-warp${warp_latest}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Upgrade $changes"
          git tag "$tag"
          git push origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.tag != ''
    uses: ./.github/workflows/ghcr-publish.yml
    with:
      ref: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.tag }}
    secrets: inherit
