services:
  tailzerotrust:
    image: ghcr.io/eurocruz/tailzerotrust:latest
    build: .
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=tailzerotrust
      # Zero Trust enrollment with a service token, leave empty for consumer WARP
      - WARP_ORGANIZATION=${WARP_ORGANIZATION:-}
      - WARP_AUTH_CLIENT_ID=${WARP_AUTH_CLIENT_ID:-}
      - WARP_AUTH_CLIENT_SECRET=${WARP_AUTH_CLIENT_SECRET:-}
    volumes:
      - ./state:/tailzerotrust/state
      - ./warp:/var/lib/cloudflare-warp
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - ip6net
    ports:
      - "41641:41641/udp"
    restart: unless-stopped

networks:
  ip6net:
    enable_ipv6: true
